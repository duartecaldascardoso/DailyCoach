<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Duarte's marathon training dashboard — track runs, gym sessions, and weekly progress towards Porto Half Marathon and Marathon 2026.">
  <meta name="theme-color" content="#F5F3EE">
  <title>Training Log · Duarte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #F5F3EE;
      --surface: #FFFFFF;
      --border:  #E5E2DB;
      --text:    #1A1A1A;
      --dim:     #6B6660;
      --muted:   #A39E96;
      --accent:  #C4704B;
      --sans:    'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --mono:    ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace;
    }

    html { font-size: 16px; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.875rem;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 640px;
      margin: 0 auto;
      padding: 48px 24px 96px;
    }

    /* ── Nav ── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 48px;
    }

    .nav-brand-name {
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .nav-brand-sub {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .nav-links {
      display: flex;
      gap: 0;
    }

    .nav-link {
      padding: 6px 14px;
      font-size: 0.8125rem;
      color: var(--muted);
      text-decoration: none;
      cursor: pointer;
      transition: color 0.15s;
      border-bottom: 1.5px solid transparent;
    }

    .nav-link:hover { color: var(--text); }
    .nav-link.active { color: var(--text); border-bottom-color: var(--text); }

    /* ── Section ── */
    .section { margin-bottom: 40px; }

    .label {
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 40px 0;
    }

    /* ── Races ── */
    .races { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }

    .race-days {
      font-family: var(--mono);
      font-size: 2.5rem;
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 8px;
    }

    .race-days-unit {
      font-family: var(--sans);
      font-size: 0.8125rem;
      font-weight: 400;
      color: var(--muted);
      margin-left: 4px;
    }

    .race-name { font-size: 0.875rem; font-weight: 500; margin-bottom: 2px; }
    .race-meta { font-size: 0.75rem; color: var(--dim); }

    /* ── Stats ── */
    .stats {
      display: flex;
    }

    .stat { flex: 1; }
    .stat + .stat { border-left: 1px solid var(--border); padding-left: 24px; }

    .stat-val {
      font-family: var(--mono);
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-lbl {
      font-size: 0.6875rem;
      color: var(--dim);
    }

    /* ── Charts ── */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .chart-wrap { }

    .chart-title {
      font-size: 0.75rem;
      color: var(--dim);
      margin-bottom: 12px;
    }

    .chart-box {
      position: relative;
      height: 170px;
    }

    /* ── Activity rows ── */
    .act-row {
      display: grid;
      grid-template-columns: 52px 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .act-row:last-child { border-bottom: none; }

    .act-date {
      font-family: var(--mono);
      font-size: 0.6875rem;
      color: var(--muted);
    }

    .act-name { font-size: 0.8125rem; font-weight: 500; }

    .act-type {
      font-size: 0.6875rem;
      color: var(--dim);
    }

    .act-nums { text-align: right; }

    .act-dist {
      font-family: var(--mono);
      font-size: 0.8125rem;
      font-weight: 500;
    }

    .act-pace {
      font-family: var(--mono);
      font-size: 0.6875rem;
      color: var(--muted);
    }

    /* ── Week list ── */
    .week-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .week-row:last-child { border-bottom: none; }
    .week-row:hover { opacity: 0.7; }

    .week-row-id {
      font-family: var(--mono);
      font-size: 0.8125rem;
      font-weight: 500;
    }

    .week-row-meta {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .week-row-stat {
      font-family: var(--mono);
      font-size: 0.8125rem;
      color: var(--dim);
    }

    /* ═══════════════════════════════════ */
    /* ── WEEKLY VIEW                   ── */
    /* ═══════════════════════════════════ */

    .week-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    .week-nav-btn {
      font-family: var(--sans);
      font-size: 0.8125rem;
      color: var(--dim);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 0;
      transition: color 0.15s;
    }

    .week-nav-btn:hover { color: var(--text); }
    .week-nav-btn:disabled { opacity: 0.25; cursor: default; }

    .week-title {
      font-family: var(--mono);
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .week-range {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
    }

    /* ── Plan / Review blocks ── */
    .prose-block {
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
    }

    .prose-block:last-child { border-bottom: none; }

    .prose-label {
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .prose-body {
      font-size: 0.8125rem;
      line-height: 1.7;
      color: var(--dim);
    }

    .obs-list {
      list-style: none;
      margin-top: 12px;
    }

    .obs-list li {
      font-size: 0.8125rem;
      color: var(--dim);
      padding: 5px 0 5px 16px;
      position: relative;
      line-height: 1.5;
    }

    .obs-list li::before {
      content: '–';
      position: absolute;
      left: 0;
      color: var(--muted);
    }

    /* ── Day cards ── */
    .day-item {
      border-bottom: 1px solid var(--border);
      border-left: 3px solid transparent;
      padding-left: 16px;
      margin-left: -16px;
      transition: border-color 0.15s;
    }

    .day-item:last-child { border-bottom: none; }

    .day-item.has-run { border-left-color: var(--accent); }
    .day-item.has-gym { border-left-color: #B8AFA6; }
    .day-item.has-both { border-left-color: var(--accent); }
    .day-item.is-rest { border-left-color: transparent; }
    .day-item.is-missed { border-left-color: #D4C5BC; border-left-style: dashed; }

    .day-header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 14px 0;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .day-header:hover { opacity: 0.7; }

    .day-name {
      font-size: 0.875rem;
      font-weight: 500;
      text-transform: capitalize;
    }

    .day-today {
      font-size: 0.6875rem;
      color: var(--accent);
      font-weight: 500;
      margin-left: 6px;
    }

    .day-date {
      font-family: var(--mono);
      font-size: 0.6875rem;
      color: var(--muted);
      margin-top: 1px;
    }

    .day-plan-text {
      font-size: 0.75rem;
      color: var(--dim);
      margin-top: 2px;
    }

    .day-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .day-km {
      font-family: var(--mono);
      font-size: 0.8125rem;
      font-weight: 500;
    }

    .day-status {
      font-size: 0.8125rem;
      width: 20px;
      text-align: center;
    }

    .s-done { color: var(--accent); }
    .s-missed { color: var(--muted); }
    .s-pending { color: var(--muted); }

    .day-body {
      padding: 0 0 20px;
    }

    .day-item.collapsed .day-body { display: none; }

    .day-metrics {
      display: flex;
      gap: 0;
      margin-bottom: 16px;
    }

    .dm { flex: 1; }
    .dm + .dm { border-left: 1px solid var(--border); padding-left: 16px; }

    .dm-val {
      font-family: var(--mono);
      font-size: 1rem;
      font-weight: 500;
      line-height: 1;
      margin-bottom: 3px;
    }

    .dm-lbl {
      font-size: 0.625rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .day-comment-block {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .day-comment-text {
      font-size: 0.8125rem;
      line-height: 1.65;
      color: var(--dim);
      margin-bottom: 12px;
    }

    .day-list-heading {
      font-size: 0.625rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-top: 10px;
      margin-bottom: 4px;
    }

    .day-list {
      list-style: none;
    }

    .day-list li {
      font-size: 0.75rem;
      color: var(--dim);
      padding: 3px 0 3px 14px;
      position: relative;
      line-height: 1.5;
    }

    .day-list li::before {
      position: absolute;
      left: 0;
      color: var(--muted);
      font-size: 0.6875rem;
    }

    .dl-right li::before { content: '✓'; }
    .dl-improve li::before { content: '→'; }

    /* ── Footer ── */
    footer {
      margin-top: 56px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-size: 0.6875rem;
      color: var(--muted);
    }

    /* ── Empty ── */
    .empty { font-size: 0.8125rem; color: var(--muted); padding: 4px 0; }

    /* ── Transitions ── */
    .view { animation: fadeUp 0.2s ease; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Responsive ── */
    @media (max-width: 500px) {
      .app { padding: 32px 20px 72px; }
      nav { flex-direction: column; gap: 8px; align-items: flex-start; }
      .races { grid-template-columns: 1fr; gap: 24px; }
      .stats { flex-wrap: wrap; gap: 16px; }
      .stat + .stat { border-left: none; padding-left: 0; }
      .charts-grid { grid-template-columns: 1fr; }
      .day-metrics { flex-wrap: wrap; gap: 12px; }
      .dm + .dm { border-left: none; padding-left: 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <nav>
      <div>
        <div class="nav-brand-name">Duarte Cardoso</div>
        <div class="nav-brand-sub">Training Log</div>
      </div>
      <div class="nav-links">
        <a class="nav-link active" data-view="home" id="nav-home">Home</a>
        <a class="nav-link" data-view="weekly" id="nav-weekly">Weekly</a>
      </div>
    </nav>

    <main id="app-main"></main>

    <footer>
      <span>Last synced <span id="js-synced">—</span></span>
      <span>Porto · 2026</span>
    </footer>
  </div>

  <script>
    /* ══════════ CONFIG ══════════ */
    const RACES = [
      { name: 'Half Marathon', city: 'Porto', date: '2026-09-13' },
      { name: 'Marathon',      city: 'Porto', date: '2026-11-08' },
    ];

    /* ══════════ UTILS ══════════ */
    function daysTo(iso) {
      const t = new Date(iso + 'T00:00:00');
      const n = new Date(); n.setHours(0,0,0,0);
      return Math.ceil((t - n) / 86400000);
    }
    function fmtShort(iso) {
      return new Date(iso + 'T12:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short' });
    }
    function fmtLong(iso) {
      return new Date(iso + 'T12:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
    }
    function fmtRange(a, b) {
      return fmtShort(a) + ' – ' + fmtShort(b);
    }

    async function fetchJSON(p) {
      const r = await fetch('data/' + p);
      return r.ok ? r.json() : null;
    }

    /* ══════════ STATE ══════════ */
    let manifest = null;
    const wCache = {}, dCache = {};
    let charts = {};

    async function loadManifest() { manifest = await fetchJSON('manifest.json'); return manifest; }
    async function loadWeek(id) { return wCache[id] ??= await fetchJSON(`weeks/${id}/week.json`); }
    async function loadDay(wk, f) { const k = wk+'/'+f; return dCache[k] ??= await fetchJSON(`weeks/${wk}/${f}.json`); }

    async function loadAll() {
      if (!manifest) return [];
      const out = [];
      for (const w of manifest.weeks) {
        const wd = await loadWeek(w.week_id);
        const ds = [];
        for (const f of w.days) { const d = await loadDay(w.week_id, f); if (d) ds.push(d); }
        out.push({ ...w, wd, ds });
      }
      return out;
    }

    /* ══════════ ROUTER ══════════ */
    function getRoute() {
      const h = location.hash || '#/';
      if (h.startsWith('#/week/')) return { v:'weekly', id: h.replace('#/week/','') };
      return { v:'home' };
    }

    function nav(h) { location.hash = h; }

    async function route() {
      const r = getRoute();
      const el = document.getElementById('app-main');
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      document.getElementById(r.v === 'home' ? 'nav-home' : 'nav-weekly').classList.add('active');
      Object.values(charts).forEach(c => c.destroy()); charts = {};
      if (!manifest) await loadManifest();
      if (r.v === 'weekly') {
        const id = r.id || manifest?.weeks?.at(-1)?.week_id;
        id ? await renderWeek(el, id) : (el.innerHTML = '<div class="empty">No weeks yet</div>');
      } else {
        await renderHome(el);
      }
    }

    /* ══════════ HOME ══════════ */
    async function renderHome(el) {
      const weeks = await loadAll();
      const today = new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

      let totKm=0, totRuns=0, longest=0, bestP=Infinity;
      const allDays = [];
      weeks.forEach(w => w.ds.forEach(d => {
        allDays.push(d);
        if (d.activity?.type === 'run') {
          totKm += d.activity.distance_km || 0;
          totRuns++;
          if (d.activity.distance_km > longest) longest = d.activity.distance_km;
          if (d.activity.pace_per_km) {
            const [m,s] = d.activity.pace_per_km.split(':').map(Number);
            const sec = m*60+s;
            if (sec < bestP) bestP = sec;
          }
        }
      }));
      const bestStr = bestP < Infinity ? `${Math.floor(bestP/60)}:${String(bestP%60).padStart(2,'0')}` : '—';

      const recent = allDays.filter(d => d.activity || d.gym?.completed).sort((a,b) => b.date.localeCompare(a.date)).slice(0,6);

      el.innerHTML = `
        <div class="view">
          <div class="section">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px">
              <div class="label" style="margin-bottom:0">Races</div>
              <div style="font-size:0.75rem;color:var(--muted)">${today}</div>
            </div>
            <div class="races">
              ${RACES.map(r => `
                <div>
                  <div class="race-days">${daysTo(r.date)}<span class="race-days-unit">days</span></div>
                  <div class="race-name">${r.name}</div>
                  <div class="race-meta">${fmtLong(r.date)} · ${r.city}</div>
                </div>
              `).join('')}
            </div>
          </div>

          <hr class="divider">

          <div class="section">
            <div class="label">Overview</div>
            <div class="stats">
              <div class="stat">
                <div class="stat-val">${totKm.toFixed(1)}</div>
                <div class="stat-lbl">total km</div>
              </div>
              <div class="stat">
                <div class="stat-val">${totRuns}</div>
                <div class="stat-lbl">runs</div>
              </div>
              <div class="stat">
                <div class="stat-val">${longest.toFixed(1)}</div>
                <div class="stat-lbl">longest</div>
              </div>
              <div class="stat">
                <div class="stat-val">${bestStr}</div>
                <div class="stat-lbl">best pace</div>
              </div>
            </div>
          </div>

          <hr class="divider">

          <div class="section">
            <div class="label">Trends</div>
            <div class="charts-grid">
              <div class="chart-wrap">
                <div class="chart-title">Km per week</div>
                <div class="chart-box"><canvas id="c-km"></canvas></div>
              </div>
              <div class="chart-wrap">
                <div class="chart-title">Runs per week</div>
                <div class="chart-box"><canvas id="c-runs"></canvas></div>
              </div>
              <div class="chart-wrap">
                <div class="chart-title">Completion</div>
                <div class="chart-box"><canvas id="c-comp"></canvas></div>
              </div>
              <div class="chart-wrap">
                <div class="chart-title">Avg pace</div>
                <div class="chart-box"><canvas id="c-pace"></canvas></div>
              </div>
            </div>
          </div>

          <hr class="divider">

          <div class="section">
            <div class="label">Recent</div>
            ${recent.length === 0 ? '<div class="empty">No activities yet</div>' :
              recent.map(d => {
                const act = d.activity;
                const gym = d.gym;
                const isRun = act?.type === 'run';
                const label = isRun ? (act.run_type || 'run') : (act?.type || (gym ? 'gym · ' + (gym.type || 'session') : '—'));
                const dur = act?.duration_minutes || gym?.duration_minutes || 0;
                return `
                <div class="act-row">
                  <div class="act-date">${fmtShort(d.date)}</div>
                  <div>
                    <div class="act-name">${label}</div>
                    <div class="act-type">${isRun ? act.run_type : (act?.type || 'gym')}</div>
                  </div>
                  <div class="act-nums">
                    ${isRun ? `<div class="act-dist">${act.distance_km} km</div><div class="act-pace">${act.pace_per_km}/km · ${dur}'</div>` : `<div class="act-dist">${dur}'</div><div class="act-pace">duration</div>`}
                  </div>
                </div>`;
              }).join('')}
          </div>

          <hr class="divider">

          <div class="section">
            <div class="label">Weeks</div>
            ${weeks.slice().reverse().map(w => {
              const rv = w.wd?.review;
              const km = rv?.total_km ?? 0;
              const runs = rv?.total_runs ?? 0;
              return `
                <div class="week-row" onclick="nav('#/week/${w.week_id}')">
                  <div>
                    <div class="week-row-id">${w.week_id}</div>
                    <div class="week-row-meta">${fmtRange(w.start_date, w.end_date)}${rv ? ` · ${Math.round(rv.completion_rate*100)}%` : ''}</div>
                  </div>
                  <div class="week-row-stat">${km.toFixed(1)} km · ${runs} runs</div>
                </div>`;
            }).join('')}
          </div>
        </div>
      `;

      buildCharts(weeks);
      if (manifest?.updated_at) {
        document.getElementById('js-synced').textContent = new Date(manifest.updated_at)
          .toLocaleDateString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
      }
    }

    /* ══════════ CHARTS ══════════ */
    function buildCharts(weeks) {
      // Only chart weeks that have actual data
      const charted = weeks.filter(w => w.ds.length > 0 || w.wd?.review);
      const labels = charted.map(w => w.week_id.replace('2026-',''));
      const kmD = charted.map(w => w.wd?.review?.total_km ?? w.ds.reduce((s,d) => s+(d.activity?.distance_km||0), 0));
      const runsD = charted.map(w => w.wd?.review?.total_runs ?? w.ds.filter(d => d.activity?.type==='run').length);
      const compD = charted.map(w => {
        if (w.wd?.review?.completion_rate != null) return Math.round(w.wd.review.completion_rate*100);
        if (!w.wd?.plan?.sessions?.length) return null;
        const done = w.ds.filter(d => d.completed).length;
        return Math.round(done / w.wd.plan.sessions.length * 100);
      });
      const paceD = charted.map(w => {
        const rs = w.ds.filter(d => d.activity?.pace_per_km);
        if (!rs.length) return null;
        return rs.reduce((s,d) => { const [m,sec] = d.activity.pace_per_km.split(':').map(Number); return s+m*60+sec; }, 0) / rs.length / 60;
      });

      const base = {
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { left: 4, right: 8, top: 20, bottom: 4 } },
        plugins: { legend: { display: false },
          tooltip: { backgroundColor:'#1A1A1A', titleFont:{family:"'Inter'",size:11}, bodyFont:{family:'ui-monospace',size:11}, cornerRadius:4, padding:8, borderColor:'#E5E2DB', borderWidth:1, titleColor:'#fff', bodyColor:'#ccc' }
        },
        scales: {
          x: { grid:{display:false}, ticks:{color:'#A39E96',font:{size:9,family:'ui-monospace'}}, border:{display:false} },
          y: { grid:{color:'#E5E2DB',lineWidth:0.5}, ticks:{color:'#A39E96',font:{size:9,family:'ui-monospace'}, maxTicksLimit:6}, border:{display:false}, beginAtZero:true, grace:'15%' }
        }
      };

      const barStyle = { backgroundColor:'rgba(26,26,26,0.15)', borderColor:'rgba(26,26,26,0.4)', borderWidth:1, borderRadius:3, barPercentage:0.55 };
      const lineStyle = { borderColor:'rgba(26,26,26,0.4)', backgroundColor:'rgba(26,26,26,0.04)', borderWidth:1.5, pointRadius:3, pointBackgroundColor:'#1A1A1A', pointBorderColor:'transparent', fill:true, tension:0.3 };

      const e = id => document.getElementById(id);

      if (e('c-km')) charts.km = new Chart(e('c-km'), { type:'bar', data:{ labels, datasets:[{ data:kmD, ...barStyle }] }, options:{...base, plugins:{...base.plugins, tooltip:{...base.plugins.tooltip, callbacks:{label:c=>c.raw.toFixed(1)+' km'}}}} });
      if (e('c-runs')) charts.runs = new Chart(e('c-runs'), { type:'bar', data:{ labels, datasets:[{ data:runsD, ...barStyle }] }, options:{...base, scales:{...base.scales, y:{...base.scales.y, ticks:{...base.scales.y.ticks,stepSize:1}}}, plugins:{...base.plugins, tooltip:{...base.plugins.tooltip, callbacks:{label:c=>c.raw+' runs'}}}} });
      if (e('c-comp')) charts.comp = new Chart(e('c-comp'), { type:'line', data:{ labels, datasets:[{ data:compD, ...lineStyle }] }, options:{...base, scales:{...base.scales, y:{...base.scales.y, max:108, grace:0, ticks:{...base.scales.y.ticks, callback:v=>v<=100?v+'%':''}}}, plugins:{...base.plugins, tooltip:{...base.plugins.tooltip, callbacks:{label:c=>c.raw+'%'}}}} });
      if (e('c-pace')) charts.pace = new Chart(e('c-pace'), { type:'line', data:{ labels, datasets:[{ data:paceD, ...lineStyle, spanGaps:true }] }, options:{...base, scales:{...base.scales, y:{...base.scales.y, reverse:true, beginAtZero:false, ticks:{...base.scales.y.ticks, maxTicksLimit:5, callback:v=>{const m=Math.floor(v),s=Math.round((v-m)*60);return m+':'+String(s).padStart(2,'0');}}}}, plugins:{...base.plugins, tooltip:{...base.plugins.tooltip, callbacks:{label:c=>{if(c.raw==null)return'—';const m=Math.floor(c.raw),s=Math.round((c.raw-m)*60);return m+':'+String(s).padStart(2,'0')+'/km';}}}}} });
    }

    /* ══════════ WEEKLY VIEW ══════════ */
    async function renderWeek(el, id) {
      const we = manifest?.weeks?.find(w => w.week_id === id);
      if (!we) { el.innerHTML = '<div class="empty">Week not found</div>'; return; }

      const wd = await loadWeek(id);
      const ds = [];
      for (const f of we.days) { const d = await loadDay(id, f); if (d) ds.push(d); }

      const idx = manifest.weeks.findIndex(w => w.week_id === id);
      const prev = idx > 0 ? manifest.weeks[idx-1].week_id : null;
      const next = idx < manifest.weeks.length-1 ? manifest.weeks[idx+1].week_id : null;

      const rv = wd?.review;
      const plan = wd?.plan;
      const wKm = rv?.total_km ?? ds.reduce((s,d) => s+(d.activity?.distance_km||0), 0);
      const wRuns = rv?.total_runs ?? ds.filter(d => d.activity?.type==='run').length;
      const wGym = rv?.total_gym_sessions ?? ds.filter(d => d.gym?.completed).length;
      const wPace = rv?.avg_pace ?? '—';

      const dayNames = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
      const start = new Date(we.start_date + 'T12:00:00');
      const allDays = dayNames.map((nm, i) => {
        const dt = new Date(start); dt.setDate(dt.getDate() + i);
        const iso = dt.toISOString().split('T')[0];
        return { nm, iso, dd: ds.find(d => d.day_of_week===nm || d.date===iso), ps: plan?.sessions?.find(s => s.day===nm) };
      });

      el.innerHTML = `
        <div class="view">
          <div class="week-nav">
            <button class="week-nav-btn" ${prev ? `onclick="nav('#/week/${prev}')"` : 'disabled'}>← Prev</button>
            <div style="text-align:center">
              <div class="week-title">${id}</div>
              <div class="week-range">${fmtRange(we.start_date, we.end_date)}</div>
            </div>
            <button class="week-nav-btn" ${next ? `onclick="nav('#/week/${next}')"` : 'disabled'}>Next →</button>
          </div>

          <div class="section">
            <div class="stats">
              <div class="stat"><div class="stat-val">${wKm.toFixed(1)}</div><div class="stat-lbl">km</div></div>
              <div class="stat"><div class="stat-val">${wRuns}</div><div class="stat-lbl">runs</div></div>
              <div class="stat"><div class="stat-val">${wGym}</div><div class="stat-lbl">gym</div></div>
              <div class="stat"><div class="stat-val">${wPace}</div><div class="stat-lbl">avg pace</div></div>
            </div>
          </div>

          <hr class="divider">

          ${plan ? `
            <div class="prose-block">
              <div class="prose-label">Plan</div>
              <div class="prose-body">${plan.summary}</div>
            </div>
          ` : ''}

          ${rv ? `
            <div class="prose-block">
              <div class="prose-label">Review</div>
              <div class="prose-body">${rv.summary}</div>
              ${rv.highlights?.length ? `
                <ul class="obs-list">${rv.highlights.map(h => `<li>${h}</li>`).join('')}</ul>
              ` : ''}
              ${rv.areas_to_improve?.length ? `
                <div class="day-list-heading" style="margin-top:16px">To improve</div>
                <ul class="obs-list">${rv.areas_to_improve.map(a => `<li>${a}</li>`).join('')}</ul>
              ` : ''}
            </div>
          ` : ''}

          <hr class="divider">

          <div class="section">
            <div class="label">Days</div>
            ${allDays.map(d => dayCard(d)).join('')}
          </div>
        </div>
      `;
    }

    function dayCard({ nm, iso, dd, ps }) {
      const now = new Date(); now.setHours(0,0,0,0);
      const dt = new Date(iso + 'T00:00:00');
      const future = dt > now;
      const isToday = dt.getTime() === now.getTime();

      let icon;
      if (dd?.completed) icon = '✓';
      else if (dd && !dd.completed) icon = '✗';
      else if (ps?.type === 'rest') icon = '○';
      else if (future || isToday) icon = '·';
      else icon = '—';

      const sClass = dd?.completed ? 's-done' : 's-missed';
      const act = dd?.activity;
      const gym = dd?.gym;
      const cm = dd?.daily_comment;
      const has = act || gym || cm;
      const cid = 'day-' + iso;
      // Determine card type class for left border
      let typeClass = '';
      if (act && gym) typeClass = 'has-both';
      else if (act?.type === 'run') typeClass = 'has-run';
      else if (act) typeClass = 'has-run';
      else if (gym?.completed) typeClass = 'has-gym';
      else if (ps?.type === 'rest') typeClass = 'is-rest';
      else if (dd && !dd.completed) typeClass = 'is-missed';

      return `
        <div class="day-item ${typeClass}" id="${cid}">
          <div class="day-header" onclick="toggleDay('${cid}')">
            <div>
              <div class="day-name">${nm}${isToday ? '<span class="day-today">today</span>' : ''}</div>
              <div class="day-date">${fmtShort(iso)}</div>
              <div class="day-plan-text">${ps?.description || dd?.planned?.description || '—'}</div>
            </div>
            <div class="day-right">
              ${act && act.type === 'run' ? `<span class="day-km">${act.distance_km} km</span>` : act ? `<span class="day-km">${act.duration_minutes}'</span>` : gym ? `<span class="day-km">${gym.duration_minutes || ''}'</span>` : ''}
              <span class="day-status ${sClass}">${icon}</span>
            </div>
          </div>
          ${has ? `
            <div class="day-body">
              ${act && act.type === 'run' ? `
                <div class="day-metrics">
                  <div class="dm"><div class="dm-val">${act.distance_km}</div><div class="dm-lbl">km</div></div>
                  <div class="dm"><div class="dm-val">${act.pace_per_km}</div><div class="dm-lbl">pace</div></div>
                  <div class="dm"><div class="dm-val">${act.duration_minutes}'</div><div class="dm-lbl">time</div></div>
                  ${act.heart_rate_avg ? `<div class="dm"><div class="dm-val">${act.heart_rate_avg}</div><div class="dm-lbl">hr avg</div></div>` : ''}
                  ${act.elevation_m ? `<div class="dm"><div class="dm-val">${act.elevation_m}m</div><div class="dm-lbl">elev</div></div>` : ''}
                </div>
                <div class="act-type">${act.run_type || 'run'}${act.shoes ? ' · ' + act.shoes : ''}</div>
              ` : act ? `
                <div class="day-metrics">
                  <div class="dm"><div class="dm-val">${act.duration_minutes}'</div><div class="dm-lbl">duration</div></div>
                </div>
                <div class="act-type">${act.type}</div>
              ` : ''}
              ${gym ? `
                <div class="day-metrics" style="margin-top:${act ? '12px' : '0'}">
                  <div class="dm"><div class="dm-val">${gym.duration_minutes || '—'}'</div><div class="dm-lbl">duration</div></div>
                </div>
                <div class="act-type">gym · ${gym.type || 'session'}${gym.completed ? ' ✓' : ''}</div>
              ` : ''}
              ${cm ? `
                <div class="day-comment-block">
                  <div class="day-comment-text">${cm.summary}</div>
                  ${cm.did_right?.length ? `
                    <div class="day-list-heading">What went right</div>
                    <ul class="day-list dl-right">${cm.did_right.map(r => `<li>${r}</li>`).join('')}</ul>
                  ` : ''}
                  ${cm.to_improve?.length ? `
                    <div class="day-list-heading">To improve</div>
                    <ul class="day-list dl-improve">${cm.to_improve.map(r => `<li>${r}</li>`).join('')}</ul>
                  ` : ''}
                </div>
              ` : ''}
            </div>
          ` : ''}
        </div>
      `;
    }

    function toggleDay(id) { document.getElementById(id)?.classList.toggle('collapsed'); }

    /* ══════════ NAV ══════════ */
    document.getElementById('nav-home').addEventListener('click', () => nav('#/'));
    document.getElementById('nav-weekly').addEventListener('click', () => {
      nav('#/week/' + (manifest?.weeks?.at(-1)?.week_id || 'latest'));
    });

    /* ══════════ INIT ══════════ */
    addEventListener('hashchange', route);
    route();
  </script>
</body>
</html>
